title: "Dr. Kousik Das"
name: "Dr. Kousik Das"

description: "Postdoctoral Research Scientist at Avignon Université"

remote_theme: "mmistakes/minimal-mistakes"

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache
  
minimal_mistakes_skin: "default"

url: "https://kousik-das.github.io"
baseurl: ""

author:
  name: "Dr. Kousik Das"
  avatar: "/assets/images/profile.jpg"
  bio: "Postdoctoral Research Scientist, Avignon Université"
  email: "kousik.das@univ-avignon.fr"
include:
  - _pages

collections:
  publications:
    output: true

defaults:
  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: single
      author_profile: true